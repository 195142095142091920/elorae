<!doctype html><html><body>
<iframe id="f" src="/login/index.html" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>{
  const d=f.contentDocument;
  const box=d.querySelector('.login-box').getBoundingClientRect();
  const k=d.querySelector('#login-elorae').getBoundingClientRect();
  const form=d.querySelector('#login-form').getBoundingClientRect();
  const cs=f.contentWindow.getComputedStyle(d.querySelector('#login-form'));
  const bs=f.contentWindow.getComputedStyle(d.querySelector('.login-box'));
  const htmlCs=f.contentWindow.getComputedStyle(d.documentElement);
  const bodyCs=f.contentWindow.getComputedStyle(d.body);
  const out={
    boxMid: box.top+box.height/2,
    formMid: form.top+form.height/2,
    delta: (form.top+form.height/2)-(box.top+box.height/2),
    kickerTopRel: k.top-box.top,
    formPos: cs.position,
    transform: cs.transform,
    justify: bs.justifyContent,
    kickerSize: f.contentWindow.getComputedStyle(d.querySelector('#login-elorae')).fontSize,
    scrollH: d.documentElement.scrollHeight,
    clientH: d.documentElement.clientHeight,
    htmlOverflow: htmlCs.overflow+','+htmlCs.overflowY,
    bodyOverflow: bodyCs.overflow+','+bodyCs.overflowY,
    bodyH: bodyCs.height,
    boxH: box.height
  };
  document.body.textContent=JSON.stringify(out,null,2);
};
</script></body></html>
