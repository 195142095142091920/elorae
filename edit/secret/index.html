<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Elorae</title>
<script>
/* Old secret viewer (encrypted pages) is retired: secrets are plain pages now. Old links
   (edit/secret.html?id=<id>) go to the page itself, which shows itself only to the people it is shared with. */
(function () {
  var id = (/[?&]id=([^&#]+)/.exec(location.search) || [])[1];
  function go(u) { location.replace(u || "/"); }
  if (!id) return go("/");
  fetch("/edit/visibility.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (m) {
    var s = (m.secrets || {})[decodeURIComponent(id)], p = s && s.path;
    go(p ? "/" + p.replace(/(^|\/)index\.html$/, "$1").replace(/\.html$/, "/") : "/");
  }).catch(function () { go("/"); });
})();
</script>
</head>
<body></body>
</html>
