# Elorae — GitHub Pages / Jekyll
# Pretty folder URLs: page.html → /page/ (and articles/foo.html → /articles/foo/).
# Old .html paths get HTML redirects in CI (see .github/workflows/pages.yml).
title: Elorae
url: https://elorae.world
permalink: pretty

plugins:
  - jekyll-redirect-from
  - jekyll-optional-front-matter
  - jekyll-relative-links

optional_front_matter:
  remove_originals: false

# Keep custom 404 at /404.html (pretty would otherwise make /404/).
defaults:
  - scope:
      path: "404.html"
    values:
      permalink: /404.html

exclude:
  - README.md
  - MILESTONES.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _verify
  - .git
  - .github
  - edit/test
  - scripts

# Pretty URLs: each page.html is mirrored at page/index.html for static Pages.
# Nav/assets use root-absolute /page/ targets. Jekyll (_config permalink + 
# scripts/pages-workflow-jekyll.yml + html-extension-redirects.sh) is prepared
# for when the Pages workflow can be updated (requires GitHub workflow scope).
