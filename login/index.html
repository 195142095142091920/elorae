<!doctype html>
<html lang="en">
<head>
<script src="/session-gate.js?v=jason-ghost"></script>
<script src="/back-scroll.js?v=bs1"></script>

<meta charset="utf-8">
<script src="/img.js?v=img-resize"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elorae</title>
<link rel="stylesheet" href="/styles.css?v=fs125">
<link rel="stylesheet" href="/html.css?v=afd2">
<script src="/rail-toggle.js?v=nfs1"></script>
<script src="/skip-link.js?v=fs125"></script>
<link rel="icon" href="/favicon.svg">
</head>
<body class="login-page">
<div class="mast"><header class="topbar login-top"><span class="mark"></span></header></div>
<main class="login-card">
<div class="login-box">
<p class="login-kicker" id="login-elorae">ELORAE</p>
<form id="login-form" autocomplete="off">
<p class="login-err" id="login-err" hidden>Try again.</p>
<input id="login-code" name="phrase" type="password" autocomplete="off" spellcheck="false" placeholder="Phrase">
<div class="login-actions" id="login-enter-actions" hidden>
<button type="submit" id="login-submit">Enter</button>
</div>
</form>
<div class="login-swap" id="login-swap">
<div class="login-stage" id="login-welcome-stage">
<p class="login-welcome" id="login-welcome" hidden>Welcome</p>
<p class="login-name" id="login-name" hidden></p>
<div class="login-actions" id="login-gh-actions" hidden>
<button type="button" id="login-github">Connect to GitHub</button>
</div>
<p class="login-gh-status" id="login-gh-status" hidden></p>
</div>
<div class="login-stage" id="login-connect" hidden></div>
</div>
<button type="button" id="login-guest" class="login-guest">Guest</button>
</div>
</main>
<!-- Phrase enter + optional guest browse; welcome + Connect in-box fade; ELORAE kicker. -->
<script src="/edit/core.js?v=edsave1"></script>
<script src="/edit/vis.js?v=devin-view"></script>
<script src="/login.js?v=vt1"></script>
<canvas id="friend-glow"></canvas>
<script src="/glow.js?v=jason-ghost"></script>
<script src="/peek.js?v=vt1" defer></script>
<script src="/edit/edit.js?v=nd4" defer></script>
</body>
</html>
