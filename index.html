<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elorae</title>
  <link rel="stylesheet" href="styles.css?v=85">
  <style>
    .entry:has(.lore.open) .pager,
    .entry:has(.life-sheet.open) .pager,
    .entry:has(.lore.open) .arrow,
    .entry:has(.life-sheet.open) .arrow {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .entry .topbar {
      padding: 0;
    }
    .entry .topbar a {
      display: inline-flex;
      align-items: flex-start;
      padding: 28px;
    }
    .entry:has(.lore.open)::before,
    .entry:has(.life-sheet.open)::before {
      height: 72vh;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.58) 0%,
        rgba(0,0,0,0.34) 48%,
        rgba(0,0,0,0.10) 78%,
        rgba(0,0,0,0) 100%
      ) !important;
    }
    .dock:has(.lore.open)::after,
    .life-dock:has(.life-sheet.open)::after {
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.42) 0%,
        rgba(0,0,0,0.16) 58%,
        rgba(0,0,0,0) 100%
      ) !important;
    }
    .entry:has(.life-sheet.open)::before {
      height: 100% !important;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.62) 0%,
        rgba(0,0,0,0.40) 18%,
        rgba(0,0,0,0.26) 48%,
        rgba(0,0,0,0.38) 100%
      ) !important;
    }
    .life-dock:has(.life-sheet.open)::after {
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.38) 0%,
        rgba(0,0,0,0.16) 28%,
        rgba(0,0,0,0.10) 70%,
        rgba(0,0,0,0.22) 100%
      ) !important;
    }
    @media (max-width: 800px) {
      .entry::before {
        height: 36vh;
        background: linear-gradient(
          to top,
          rgba(0,0,0,0.62) 0%,
          rgba(0,0,0,0.38) 42%,
          rgba(0,0,0,0.12) 72%,
          rgba(0,0,0,0) 100%
        );
      }
      .entry .topbar {
        background: linear-gradient(
          to bottom,
          rgba(0,0,0,0.56) 0%,
          rgba(0,0,0,0.28) 55%,
          rgba(0,0,0,0) 100%
        );
      }
      .entry .topbar a {
        min-height: 52px;
        padding: 14px;
      }
      .entry:has(.lore.open)::before {
        height: 78vh;
        background: linear-gradient(
          to top,
          rgba(0,0,0,0.60) 0%,
          rgba(0,0,0,0.36) 52%,
          rgba(0,0,0,0.10) 80%,
          rgba(0,0,0,0) 100%
        ) !important;
      }
      .entry:has(.life-sheet.open)::before {
        height: 100% !important;
        background: linear-gradient(
          to bottom,
          rgba(0,0,0,0.64) 0%,
          rgba(0,0,0,0.42) 16%,
          rgba(0,0,0,0.26) 46%,
          rgba(0,0,0,0.40) 100%
        ) !important;
      }
      .life-dock:has(.life-sheet.open) {
        padding-right: 0;
      }
      .life-sheet.open {
        padding-right: 12px;
        padding-left: 4px;
      }
      .life-sheet::-webkit-scrollbar {
        width: 2px;
      }
    }
  </style>
</head>
<body>
  <script src="entries.js?v=85"></script>
  <script src="journal.js?v=85"></script>
  <script src="app.js?v=85"></script>
</body>
</html>
