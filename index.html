<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elorae</title>
  <link rel="stylesheet" href="styles.css?v=80">
  <style>
    .entry:has(.lore.open) .pager,
    .entry:has(.life-sheet.open) .pager,
    .entry:has(.lore.open) .arrow,
    .entry:has(.life-sheet.open) .arrow {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    @media (max-width: 800px) {
      .entry::before {
        height: 36vh;
        background: linear-gradient(
          to top,
          rgba(0,0,0,0.62) 0%,
          rgba(0,0,0,0.38) 42%,
          rgba(0,0,0,0.12) 72%,
          rgba(0,0,0,0) 100%
        );
      }
      .entry .topbar {
        background: linear-gradient(
          to bottom,
          rgba(0,0,0,0.56) 0%,
          rgba(0,0,0,0.28) 55%,
          rgba(0,0,0,0) 100%
        );
      }
    }
  </style>
</head>
<body>
  <script src="entries.js?v=80"></script>
  <script src="journal.js?v=80"></script>
  <script src="app.js?v=80"></script>
</body>
</html>
