<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Elorae</title>

  <link rel="stylesheet" href="styles.css?v=145">
  <link rel="stylesheet" href="figure-lore.css?v=145">
  <link rel="stylesheet" href="codex.css?v=164">
  <style>
    html { background: #070707; }
    body:has(.mast), body.journal-page, body.atlas-page, body.room:not(.journal-page) {
      overflow: hidden; height: 100dvh;
    }
    .mast, .journal-page .topbar, .room:not(.journal-page) .topbar, .atlas-page .topbar {
      position: fixed !important; top: 0; left: 0; right: 0; z-index: 50;
      background: #070707 !important;
    }
    .wall {
      position: fixed !important; top: 96px; left: 0; right: 0; bottom: 0;
      overflow-y: auto; z-index: 1; align-content: start; grid-auto-rows: min-content;
    }
    .tile { aspect-ratio: 4 / 3 !important; height: auto !important; }
    .sheet, .index-list, .room-body, .atlas-stage {
      position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
      overflow-y: auto; overflow-x: hidden; z-index: 2;
    }
    .journal-page .sheet {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 56px, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 56px, #000 100%);
    }
    .journal-page .journal-read { padding-top: 20px; }
    .subbar,
    .atlas-page .atlas-tabs,
    .journal-page .chapter-tabs {
      display: flex !important;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px !important;
      min-height: 40px;
      padding: 0 28px 16px !important;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important;
      font-size: 11px !important;
      letter-spacing: 0.22em !important;
      text-transform: uppercase;
      color: #8f8a82;
      background: #070707 !important;
    }
    .atlas-page .atlas-tabs,
    .journal-page .chapter-tabs {
      position: fixed !important;
      top: 56px !important;
      left: 0;
      right: 0;
      z-index: 40;
    }
    .atlas-page .atlas-tabs a,
    .journal-page .chapter-tabs a,
    .subbar a {
      padding: 0 !important;
      border: 0 !important;
      color: #8f8a82;
    }
    .atlas-page .atlas-tabs a.active,
    .atlas-page .atlas-tabs a:hover,
    .journal-page .chapter-tabs a.active,
    .journal-page .chapter-tabs a:hover,
    .subbar a.active,
    .subbar a:hover { color: #f3eee6; }
    .atlas-page:has(.atlas-tabs) .atlas-stage,
    .journal-page:has(.chapter-tabs) .sheet { top: 96px; }
    @media (max-width: 800px) {
      .wall { top: 88px; }
      .sheet, .index-list, .room-body, .atlas-stage { top: 48px; }
      .subbar,
      .atlas-page .atlas-tabs,
      .journal-page .chapter-tabs {
        gap: 10px !important;
        letter-spacing: 0.12em !important;
        padding: 0 12px 12px !important;
        min-height: 36px;
      }
      .atlas-page .atlas-tabs,
      .journal-page .chapter-tabs { top: 48px !important; }
      .atlas-page:has(.atlas-tabs) .atlas-stage,
      .journal-page:has(.chapter-tabs) .sheet { top: 88px; }
    }
  </style>
</head>
<body>
  <script src="entries.js?v=132"></script>

  <script src="veil.js?v=132"></script>
  <script src="codex-ui.js?v=162"></script>
  <script>
    (function () {
      if (!location.hash || location.hash === "#" || location.hash === "#/") location.replace("#/gallery");
      window._from = window._from || "#/gallery";
      document.addEventListener("click", function (e) {
        const a = e.target.closest(".topbar a");
        if (!a || a.textContent.trim() !== "Elorae") return;
        e.preventDefault();
        if (location.hash && location.hash !== "#/seal") window._from = location.hash;
        location.hash = "#/seal";
      }, true);
    })();
  </script>
</body>
</html>
