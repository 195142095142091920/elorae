<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elorae</title>
  <link rel="stylesheet" href="styles.css?v=88">
  <style>
    html { background: #070707; }
    .entry:has(.lore.open) .pager,
    .entry:has(.life-sheet.open) .pager,
    .entry:has(.lore.open) .arrow,
    .entry:has(.life-sheet.open) .arrow {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .entry .topbar { padding: 0; }
    .entry .topbar a {
      display: inline-flex;
      align-items: flex-start;
      padding: 28px;
    }
    body:has(.mast),
    body.journal-page,
    body.atlas-page,
    body.room:not(.journal-page) {
      overflow: hidden;
      height: 100dvh;
    }
    .mast {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #070707 !important;
    }
    .wall {
      position: fixed !important;
      top: 96px;
      left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
      padding-top: 0 !important;
    }
    .room:not(.journal-page) .topbar,
    .atlas-page .topbar {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #070707 !important;
    }
    .index-list,
    .room-body,
    .atlas-stage {
      position: fixed;
      top: 56px;
      left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 2;
    }
    .journal-page .topbar {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #070707 !important;
      text-shadow: none;
    }
    .sheet {
      position: fixed;
      top: 56px;
      left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 2;
    }
    .journal-page .chapter-tabs {
      padding-top: 8px !important;
    }
    .entry:has(.lore.open)::before,
    .entry:has(.life-sheet.open)::before {
      height: 72vh;
      background: linear-gradient(to top, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0.34) 48%, rgba(0,0,0,0.10) 78%, rgba(0,0,0,0) 100%) !important;
    }
    .entry:has(.life-sheet.open)::before {
      height: 100% !important;
      background: linear-gradient(to bottom, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.40) 18%, rgba(0,0,0,0.26) 48%, rgba(0,0,0,0.38) 100%) !important;
    }
    @media (max-width: 800px) {
      .wall { top: 88px; }
      .sheet,
      .index-list,
      .room-body,
      .atlas-stage { top: 48px; }
      .entry::before {
        height: 36vh;
        background: linear-gradient(to top, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.38) 42%, rgba(0,0,0,0.12) 72%, rgba(0,0,0,0) 100%);
      }
      .entry .topbar {
        background: linear-gradient(to bottom, rgba(0,0,0,0.56) 0%, rgba(0,0,0,0.28) 55%, rgba(0,0,0,0) 100%);
      }
      .entry .topbar a {
        min-height: 52px;
        padding: 14px;
      }
      .life-dock:has(.life-sheet.open) { padding-right: 0; }
      .life-sheet.open { padding-right: 12px; padding-left: 4px; }
      .life-sheet::-webkit-scrollbar { width: 2px; }
    }
  </style>
</head>
<body>
  <script src="entries.js?v=88"></script>
  <script src="journal.js?v=88"></script>
  <script src="app.js?v=88"></script>
</body>
</html>
