<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Elorae</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#070707">
  <link rel="stylesheet" href="styles.css?v=145">
  <link rel="stylesheet" href="figure-lore.css?v=145">
  <link rel="stylesheet" href="codex.css?v=152">
  <style>
    html { background: #070707; }
    body:has(.mast), body.journal-page, body.atlas-page, body.room:not(.journal-page) {
      overflow: hidden; height: 100dvh;
    }
    .mast, .journal-page .topbar, .room:not(.journal-page) .topbar, .atlas-page .topbar {
      position: fixed !important; top: 0; left: 0; right: 0; z-index: 50;
      background: #070707 !important;
    }
    .wall {
      position: fixed !important; top: 96px; left: 0; right: 0; bottom: 0;
      overflow-y: auto; z-index: 1; align-content: start; grid-auto-rows: min-content;
    }
    .tile { aspect-ratio: 4 / 3 !important; height: auto !important; }
    .sheet, .index-list, .room-body, .atlas-stage {
      position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
      overflow-y: auto; overflow-x: hidden; z-index: 2;
    }
    .atlas-page .atlas-tabs {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      z-index: 40;
      background: #070707;
      padding-top: 8px;
      padding-bottom: 14px;
    }
    .atlas-page:has(.atlas-tabs) .atlas-stage { top: 96px; }
    @media (max-width: 800px) {
      .wall { top: 88px; }
      .sheet, .index-list, .room-body, .atlas-stage { top: 48px; }
      .atlas-page .atlas-tabs { top: 48px; }
      .atlas-page:has(.atlas-tabs) .atlas-stage { top: 88px; }
    }
  </style>
</head>

  <script src="codex-souls.js?v=145"></script>
  <script src="codex-lore.js?v=145"></script>
  <script src="codex-lore-b.js?v=145"></script>
  <script src="vault.js?v=132"></script>

  <script src="veil.js?v=132"></script>
  <script src="codex-ui.js?v=148"></script>
  <script>
    (function () {
      if (!location.hash || location.hash === "#" || location.hash === "#/") location.replace("#/gallery");
      window._from = window._from || "#/gallery";
      document.addEventListener("click", function (e) {
        const a = e.target.closest(".topbar a");
        if (!a || a.textContent.trim() !== "Elorae") return;
        e.preventDefault();
        if (location.hash && location.hash !== "#/seal") window._from = location.hash;
        location.hash = "#/seal";
      }, true);
    })();
  </script>
