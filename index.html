<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elorae</title>
  <link rel="stylesheet" href="styles.css?v=99">
  <style>
    html { background: #070707; }
    .entry:has(.lore.open) .arrow,
    .entry:has(.life-sheet.open) .arrow,
    .entry:has(.lore.open) .fit-mark,
    .entry:has(.life-sheet.open) .fit-mark {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .entry:has(.lore.open) .pager::before,
    .entry:has(.life-sheet.open) .pager::before {
      opacity: 0 !important;
    }
    .entry:has(.hero.full) .arrow,
    .entry:has(.hero.full) .dock,
    .entry:has(.hero.full) .life-dock {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .entry:has(.hero.full)::before { opacity: 0 !important; }
    .entry .topbar {
      padding: 0;
      justify-content: space-between;
    }
    .entry .topbar a {
      display: inline-flex;
      align-items: flex-start;
      padding: 28px;
    }
    .fit-toggle {
      border: 0;
      background: none;
      color: #e8e2d8;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.72;
      z-index: 6;
    }
    .fit-toggle:hover { opacity: 1; }
    .fit-mark svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: square;
      transform: translateY(6px);
    }
    .hero.full img { object-fit: contain !important; }
    .entry::before,
    .dock::after,
    .life-dock::after { transition: none !important; }
    body:has(.mast),
    body.journal-page,
    body.atlas-page,
    body.room:not(.journal-page) {
      overflow: hidden;
      height: 100dvh;
    }
    .mast {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #070707 !important;
    }
    .wall {
      position: fixed !important;
      top: 96px;
      left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
      padding-top: 0 !important;
      align-content: start;
      grid-auto-rows: min-content;
    }
    .tile {
      aspect-ratio: 4 / 3 !important;
      height: auto !important;
      align-self: start;
    }
    .room:not(.journal-page) .topbar,
    .atlas-page .topbar {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #070707 !important;
    }
    .index-list,
    .room-body,
    .atlas-stage {
      position: fixed;
      top: 56px;
      left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 2;
    }
    .journal-page .topbar {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #070707 !important;
      text-shadow: none;
    }
    .sheet {
      position: fixed;
      top: 56px;
      left: 0; right: 0; bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 2;
    }
    .journal-page .chapter-tabs { padding-top: 8px !important; }
    .entry:has(.lore.open)::before,
    .entry:has(.life-sheet.open)::before {
      height: 72vh;
      background: linear-gradient(to top, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0.34) 48%, rgba(0,0,0,0.10) 78%, rgba(0,0,0,0) 100%) !important;
    }
    .entry:has(.life-sheet.open)::before {
      height: 100% !important;
      background: linear-gradient(to bottom, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.40) 18%, rgba(0,0,0,0.26) 48%, rgba(0,0,0,0.38) 100%) !important;
    }
    @media (min-width: 801px) {
      .topbar .fit-toggle { display: none; }
      .pager {
        gap: 4px;
        isolation: isolate;
      }
      .pager::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 260px;
        height: 96px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: -1;
        background: radial-gradient(
          ellipse at center,
          rgba(0,0,0,0.55) 0%,
          rgba(0,0,0,0.32) 38%,
          rgba(0,0,0,0.12) 62%,
          rgba(0,0,0,0) 78%
        );
      }
      .fit-mark {
        position: static;
        transform: none;
        left: auto;
        bottom: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 48px;
        padding: 0;
      }
    }
    @media (max-width: 800px) {
      .fit-mark { display: none; }
      .wall { top: 88px; }
      .sheet,
      .index-list,
      .room-body,
      .atlas-stage { top: 48px; }
      .sheet { overflow-x: hidden; width: 100%; }
      .journal-read {
        max-width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding-left: 18px !important;
        padding-right: 18px !important;
        box-sizing: border-box;
      }
      .journal-read::before { inset: -24px 0 !important; }
      .journal-fig img { max-width: 100%; height: auto; }
      .dock,
      .life-dock { transition: opacity 240ms ease !important; }
      .lore,
      .life-sheet {
        transform: translateY(8px);
        transition: opacity 280ms ease, transform 280ms ease !important;
      }
      .lore.open,
      .life-sheet.open { transform: translateY(0); }
      .entry::before {
        height: 36vh;
        background: linear-gradient(to top, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.38) 42%, rgba(0,0,0,0.12) 72%, rgba(0,0,0,0) 100%);
        transition: none !important;
      }
      .entry .topbar {
        background: linear-gradient(to bottom, rgba(0,0,0,0.56) 0%, rgba(0,0,0,0.28) 55%, rgba(0,0,0,0) 100%);
      }
      .entry .topbar a,
      .topbar .fit-toggle {
        min-height: 52px;
        padding: 14px;
      }
      .life-dock:has(.life-sheet.open) { padding-right: 0; }
      .life-sheet.open { padding-right: 12px; padding-left: 4px; }
      .life-sheet::-webkit-scrollbar { width: 2px; }
    }
  </style>
</head>
<body>
  <script src="entries.js?v=99"></script>
  <script src="journal.js?v=99"></script>
  <script src="app.js?v=99"></script>
</body>
</html>
